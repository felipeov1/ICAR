# ===================================================================
# PRODUCTION-SPECIFIC OVERRIDES
# ===================================================================

# --- Application & Server ---
app.production=true
server.error.include-message=on_error
server.error.include-stacktrace=none


# --- Database ---
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}


# --- JPA & Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# --- Security & JWT ---
jwt.secret=${JWT_SECRET}


# --- File Storage ---
storage.base-url=https://api.icarplus.com.br


# ===================================================================
# EXTERNAL SERVICES
# ===================================================================

# --- EMAIL (SMTP) - HOSTINGER ---
spring.mail.host=smtp.hostinger.com
spring.mail.port=465
spring.mail.username=comercial@icarplus.com.br
spring.mail.password=${SMTP_PASSWORD} 
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory


# --- MERCADO PAGO ---
mercadopago.webhook-secret-key=${MP_WEBHOOK_SECRET}
mercadopago.app-id=${MP_APP_ID}
mercadopago.client-secret=${MP_CLIENT_SECRET}
mercadopago.redirect-uri=https://api.icarplus.com.br/api/v1/mercado-pago/callback


# --- Logging ---
logging.level.root=INFO
logging.level.com.icar=INFO
logging.level.org.hibernate.SQL=WARN