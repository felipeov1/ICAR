# --- application-prod.properties ---


# --- URLs (Production) ---
app.api-url=https://api.icarplus.com.br
app.frontend-url=https://app.icarplus.com.br
app.gestao-url=https://gestao.icarplus.com.br
app.logo-url=https://api.icarplus.com.br/uploads/static/logo-icar-email.png

# --- Database (Production) ---
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

# --- JPA & Hibernate (Production) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- File Storage (Production) ---
storage.base-url=https://api.icarplus.com.br
storage.location=/var/www/icarplus/uploads

# --- Email (Production) ---
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Mercado Pago (Production) ---
mercadopago.redirect-uri=https://api.icarplus.com.br/api/v1/mercado-pago/callback

# --- Logging (Production) ---
#logging.level.com.icar=INFO
#logging.level.org.hibernate.SQL=WARN

# --- Logging (Production - TEMPORARY DEBUG) ---
logging.level.com.icar.platform=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE