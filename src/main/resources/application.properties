# --- application.properties ---


# --- Application & Server ---
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=false

# --- Flyway Database Migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- Security & JWT ---
jwt.secret=6D5A7134743777217A25432A462D4A614E645267556B58703272357538782F41
jwt.expiration.access-token=900000
jwt.expiration.refresh-token=2592000000

# --- File Storage ---
# Armazena localmente em dev e usa S3/GCP em prod (URLs diferentes)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB

# --- API Documentation (Swagger / OpenAPI) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/v3/api-docs
springdoc.packages-to-scan=com.icar.platform.api.controller
springdoc.swagger-ui.doc-expansion=none

# --- External Services - EMAIL (SMTP) ---
spring.mail.host=smtp.hostinger.com
spring.mail.port=465
spring.mail.username=comercial@icarplus.com.br
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# --- External Services - MERCADO PAGO ---
mercadopago.app-id=${MP_APP_ID}
mercadopago.client-secret=${MP_CLIENT_SECRET}
mercadopago.webhook-secret-key=${MP_WEBHOOK_SECRET}

# --- Logging ---
logging.level.root=INFO

