name: Deploy Completo (Backend e Frontend)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build e Deploy Unificado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código (Backend)
        uses: actions/checkout@v4
        with:
          repository: felipeov1/icar-backend # Puxe o backend
          token: ${{ secrets.GITHUB_TOKEN }} # Token padrão para repositório público

      - name: Checkout do código (Frontend)
        uses: actions/checkout@v4
        with:
          repository: felipeov1/icar-frontend # Puxe o frontend
          path: ./frontend-dist # Diretório para o frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }} # Use o token para repo privado

      # A parte do frontend é feita aqui para não sobrecarregar o servidor
      - name: Configurar Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-dist/package-lock.json'

      - name: Instalar dependências (Frontend)
        run: npm install
        working-directory: ./frontend-dist

      - name: Compilar o projeto (Frontend Build)
        run: npm run build
        working-directory: ./frontend-dist

      # Envie o backend e o frontend para o servidor
      - name: Deploy Unificado no Servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Iniciando deploy unificado no servidor..."
            
            # --- Enviar e publicar frontend ---
            echo "📂 Enviando e publicando build do Frontend..."
            sudo rsync -av --delete ./frontend-dist/dist/ /var/www/icarplus.com.br/
            sudo rsync -av --delete ./frontend-dist/dist/ /var/www/app-cliente/
            sudo rsync -av --delete ./frontend-dist/dist/ /var/www/app-gestao/
            
            echo "🔐 Corrigindo permissões do Frontend..."
            sudo chown -R www-data:www-data /var/www/icarplus.com.br /var/www/app-cliente /var/www/app-gestao
            sudo chmod -R 755 /var/www/icarplus.com.br /var/www/app-cliente /var/www/app-gestao
            
            # --- Executar deploy do Backend ---
            echo "☕ Executando script de deploy do Backend..."
            /opt/icarplus/backend/deploy.sh