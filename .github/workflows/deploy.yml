name: Deploy Completo (Backend e Frontend)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build e Deploy Unificado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código (Backend)
        uses: actions/checkout@v4
        with:
          repository: felipeov1/icar-backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout do código (Frontend)
        uses: actions/checkout@v4
        with:
          repository: felipeov1/icar-frontend
          path: ./frontend-dist
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: Configurar Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-dist/package-lock.json'

      - name: Instalar dependências (Frontend)
        run: npm install
        working-directory: ./frontend-dist

      - name: Compilar o projeto (Frontend Build)
        run: npm run build
        working-directory: ./frontend-dist

      # --- ETAPA DE DEPLOY DIVIDIDA ---

      - name: 1. Enviar Build do Frontend para o Servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./frontend-dist/dist/" # <-- ORIGEM: A pasta no GitHub Runner
          target: "/tmp/frontend-build"   # <-- DESTINO: Uma pasta temporária no servidor

      - name: 2. Publicar Frontend e Executar Deploy do Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Iniciando publicação no servidor..."
            
            # --- Publicar frontend a partir da pasta temporária ---
            echo "📂 Publicando build do Frontend para os diretórios finais..."
            sudo rsync -av --delete "/tmp/frontend-build/" "/var/www/icarplus.com.br/"
            sudo rsync -av --delete "/tmp/frontend-build/" "/var/www/app-cliente/"
            sudo rsync -av --delete "/tmp/frontend-build/" "/var/www/app-gestao/"
            
            echo "🔐 Corrigindo permissões do Frontend..."
            sudo chown -R www-data:www-data /var/www/icarplus.com.br /var/www/app-cliente /var/www/app-gestao
            sudo chmod -R 755 /var/www/icarplus.com.br /var/www/app-cliente /var/www/app-gestao
            
            echo "🧹 Limpando pasta temporária..."
            rm -rf "/tmp/frontend-build"

            # --- Executar deploy do Backend ---
            echo "☕ Executando script de deploy do Backend..."
            sudo /opt/icarplus/backend/deploy.sh
